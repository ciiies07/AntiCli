[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anticli"
version = "2.6.0"
description = "Entorno agéntico y TUI quirúrgico para modelos locales vía llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ciiies07"}
]
dependencies = [
    "google-antigravity",
    "rich",
    "prompt_toolkit",
]

[project.scripts]
anticli = "anticli:run_cli"
AntiCli = "anticli:run_cli"

[tool.setuptools]
py-modules = ["anticli"]
packages = ["skills"]
