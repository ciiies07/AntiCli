<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>π-Antigravity Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Dirección de Arte: Retro Portátil / Game Boy Dot-Matrix LCD */
        :root {
            --bg-color: #0F380F; /* Negro verdoso oscuro */
            --grid-color: #306230; /* Verde oscuro */
            --snake-color: #9BBC0F; /* Verde oliva fósforo */
            --food-color: #00FF66; /* Verde brillante */
            --border-color: #00FF66;
            --font-mono: 'VT323', monospace;
            --grid-size: 20px;
            --game-size: 300px;
        }

        body {
            background-color: #1A1A1A;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: var(--font-mono);
            color: var(--snake-color);
        }

        #game-container {
            background-color: var(--bg-color);
            border: 4px solid var(--border-color);
            box-shadow: 0 0 15px var(--border-color);
            padding: 10px;
            display: inline-block;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(15, var(--grid-size));
            grid-template-rows: repeat(15, var(--grid-size));
            width: calc(15 * var(--grid-size));
            height: calc(15 * var(--grid-size));
            background-color: var(--grid-color);
        }

        .cell {
            width: var(--grid-size);
            height: var(--grid-size);
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 102, 0.2); /* Rejilla sutil */
        }

        .snake {
            background-color: var(--snake-color);
            border: 1px solid var(--snake-color);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .food {
            background-color: var(--food-color);
            border-radius: 50%; /* Píxeles redondeados */
            box-shadow: 0 0 8px var(--food-color);
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-board">
            <!-- Celdas generadas por JS -->
        </div>
        <div id="status">SCORE: 0 | CONTROLES: ← → ↑ ↓</div>
    </div>

    <script>
        // --- Game State ---
        const GRID_COLS = 15;
        const GRID_ROWS = 15;
        const CELL_SIZE = 20; // Corresponde a --grid-size
        const boardElement = document.getElementById('game-board');
        const statusElement = document.getElementById('status');

        let snake = [{ x: 7, y: 7 }]; // Posición inicial en el centro
        let food = { x: 5, y: 5 };
        let dx = 1; // Dirección inicial (derecha)
        let dy = 0;
        let score = 0;
        let gameLoopId = null;
        let gameSpeed = 150; // ms (Más rápido = menor ms)
        let isRunning = false;
        let foodSpawnInterval = 1500; // ms
        let lastFoodSpawnTime = 0;

        // --- Setup ---

        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;
                    boardElement.appendChild(cell);
                }
            }
        }

        function draw() {
            // 1. Limpiar el tablero
            document.querySelectorAll('.cell').forEach(cell => {
                cell.className = 'cell';
            });

            // 2. Dibujar la serpiente
            snake.forEach(segment => {
                const cell = document.getElementById(`cell-${segment.y}-${segment.x}`);
                if (cell) {
                    cell.classList.add('snake');
                }
            });

            // 3. Dibujar la comida
            const foodCell = document.getElementById(`cell-${food.y}-${food.x}`);
            if (foodCell) {
                foodCell.classList.add('food');
            }
        }

        function generateFood() {
            let newFoodPosition;
            do {
                newFoodPosition = {
                    x: Math.floor(Math.random() * GRID_COLS),
                    y: Math.floor(Math.random() * GRID_ROWS)
                };
            } while (isFoodOnSnake(newFoodPosition));
            food = newFoodPosition;
        }

        function isFoodOnSnake(pos) {
            return snake.some(segment => segment.x === pos.x && segment.y === pos.y);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Colisión con bordes
            if (head.x < 0 || head.x >= GRID_COLS || head.y < 0 || head.y >= GRID_ROWS) {
                gameOver();
                return;
            }

            // Colisión con sí misma (comenzando desde el segundo segmento)
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Añadir la nueva cabeza
            snake.unshift(head);

            // Comprobar si come la comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                statusElement.textContent = `SCORE: ${score} | CONTROLES: ← → ↑ ↓`;
                generateFood();
                // No remover la cola, la serpiente crece
            } else {
                // Remover la cola si no come
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoopId);
            statusElement.textContent = `GAME OVER | SCORE: ${score} | CONTROLES: ← → ↑ ↓`;
        }

        function gameLoop() {
            if (!isRunning) return;

            moveSnake();
            gameLoopId = setTimeout(gameLoop, gameSpeed);
        }

        // --- Input Handlers ---
        document.addEventListener('keydown', (e) => {
            if (!isRunning) {
                if (e.key === 'Enter' || e.key === ' ') {
                    startGame();
                }
                return;
            }

            const keyPressed = e.key;
            const movingLeft = keyPressed === 'ArrowLeft' || keyPressed === 'a';
            const movingRight = keyPressed === 'ArrowRight' || keyPressed === 'd';
            const movingUp = keyPressed === 'ArrowUp' || keyPressed === 'w';
            const movingDown = keyPressed === 'ArrowDown' || keyPressed === 's';

            if (movingLeft && dx === 0) { dx = -1; dy = 0; }
            if (movingRight && dx === 0) { dx = 1; dy = 0; }
            if (movingUp && dy === 0) { dx = 0; dy = -1; }
            if (movingDown && dy === 0) { dx = 0; dy = 1; }

            e.preventDefault(); // Previene el scroll
        });

        function startGame() {
            if (isRunning) return;
            score = 0;
            gameSpeed = 150;
            isRunning = true;
            snake = [{ x: 7, y: 7 }];
            dx = 1;
            dy = 0;
            statusElement.textContent = 'SCORE: 0 | CONTROLES: ← → ↑ ↓';
            generateFood();
            createBoard();
            draw();
            lastFoodSpawnTime = performance.now();

            // Reiniciar el bucle principal
            gameLoopId = setTimeout(gameLoop, gameSpeed);
        }

        // --- Initialization ---
        createBoard();
        generateFood();
    </script>
</body>
</html>
